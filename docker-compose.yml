version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: sysmon-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sysmon-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET_APP: api
    container_name: sysmon-api
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: "mongodb://root:secretpassword@mongodb:27017"
    depends_on:
      - mongodb

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET_APP: worker
    container_name: sysmon-worker
    environment:
      MONGO_URI: "mongodb://root:secretpassword@mongodb:27017"
      RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      - mongodb
      - rabbitmq

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET_APP: consumer
    container_name: sysmon-consumer
    environment:
      RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      - rabbitmq

volumes:
  mongo_data: